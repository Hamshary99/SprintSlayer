paths:
  /audit-logs:
    get:
      summary: Get audit logs (Admin only)
      tags:
        - Audit Logs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: priority
          schema:
            type: string
            enum: [HIGH, MEDIUM, LOW]
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: integer
      responses:
        '200':
          description: List of audit log entries
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
