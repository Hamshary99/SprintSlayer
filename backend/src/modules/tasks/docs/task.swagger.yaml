paths:
  /task:
    post:
      summary: Create a task
      tags: 
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, projectId]
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [to_do, in_progress, done]
                priority:
                  type: string
                  enum: [low, medium, high]
                dueDate:
                  type: string
                  format: date-time
                projectId:
                  type: integer
                assigneeId:
                  type: integer
      responses:
        '201':
          description: Task created

  /task/{id}:
    get:
      summary: Get task by ID
      tags: 
        - Tasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details

    patch:
      summary: Update a task
      tags: 
        - Tasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [to_do, in_progress, done]
                priority:
                  type: string
                  enum: [low, medium, high]
                dueDate:
                  type: string
                  format: date-time
                projectId:
                  type: integer
                assigneeId:
                  type: integer
      responses:
        '200':
          description: Task updated

    delete:
      summary: Delete a task
      tags: 
        - Tasks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task deleted

  /task/project/{projectId}:
    get:
      summary: Get tasks by Project ID
      tags: 
        - Tasks
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of tasks for a project

  /task/assignee/{assigneeId}:
    get:
      summary: Get tasks by Assignee ID
      tags: 
        - Tasks
      parameters:
        - in: path
          name: assigneeId
          required: true
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of tasks for an assignee
